<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- Primary SEO -->
    <title>OneTrip | Travel Planning & Destination Guide</title>

    <meta
      name="description"
      content="Plan your next trip with OneTrip. Discover beautiful destinations, travel information, and useful travel planning resources."
    />

    <meta
      name="keywords"
      content="travel planning, travel destinations, trip planner, tourism, vacation planning, OneTrip"
    />

    <meta name="author" content="OneTrip" />

    <!-- Search engine instructions -->
    <meta name="robots" content="index, follow" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/App.logo.png" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://yourdomain.com/" />

    <!-- Open Graph / Social Sharing -->
    <meta property="og:title" content="OneTrip | Travel Planning & Destination Guide" />

    <meta
      property="og:description"
      content="Discover destinations and plan your next trip with OneTrip."
    />

    <meta property="og:type" content="website" />

    <meta property="og:url" content="https://yourdomain.com/" />

    <meta
      property="og:image"
      content="https://yourdomain.com/og-image.jpg"
    />

    <!-- Twitter/X sharing -->
    <meta name="twitter:card" content="summary_large_image" />

    <meta
      name="twitter:title"
      content="OneTrip | Travel Planning & Destination Guide"
    />

    <meta
      name="twitter:description"
      content="Discover destinations and plan your next trip with OneTrip."
    />

    <meta
      name="twitter:image"
      content="https://yourdomain.com/og-image.jpg"
    />
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
